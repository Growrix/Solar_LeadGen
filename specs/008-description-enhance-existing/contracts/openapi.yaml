openapi: 3.0.3
info:
  title: Quote Builder Enhancement Contracts
  version: 1.0.0
paths:
  /api/quotes/{leadId}/options:
    get:
      summary: List quote options for a lead
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      summary: Create a quote option (from preset or duplicate)
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromPreset:
                  type: string
                duplicateOptionId:
                  type: string
      responses:
        '201':
          description: Created
  /api/quotes/{leadId}/options/{optionId}:
    patch:
      summary: Update quote option (line items, incentives, assumptions)
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: string
        - in: path
          name: optionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
  /api/quotes/{leadId}/validate-compliance:
    post:
      summary: Validate compliance artefacts for a lead before submit
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
